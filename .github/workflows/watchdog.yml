name: Watchdog

# Emails you (a failed run) if the daily routine hasn't queued today's posts by
# 08:30/09:30 New York time, before the first post goes out.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/watchdog.py
