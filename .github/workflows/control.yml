name: Control
run-name: "Control: ${{ inputs.action }} ${{ inputs.target }}"

# Started by the dashboard's buttons. Each run carries out one action
# (see scripts/control.py), rebuilds the dashboard and saves the result.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [pause, resume, remove, restore, post_now, reschedule, replace, edit_caption, edit_slide, posts_per_day, reels_per_day, reels_mode, spares_per_day, delete_instagram, post_reel, cancel_reel, reschedule_reel, add_music, remove_music, refresh_dashboard]
      target:
        description: "Post id (POST_ID#N for a slide), a number for posts_per_day / spares_per_day, a link (add_music) or file name (remove_music)"
        required: false
        default: ""
      text:
        description: "New text (edit actions), a UTC time (reschedule), or 'title | credit | license' (add_music)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tools (music only)
        if: inputs.action == 'add_music'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Apply the action
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          TEXT: ${{ inputs.text }}
        run: python scripts/control.py "$ACTION" "$TARGET"
      - name: Rebuild dashboard
        continue-on-error: true
        run: python scripts/dashboard.py --force
      - name: Save
        env:
          ACTION: ${{ inputs.action }}
        run: |
          git config user.name "publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add state config.json docs queue assets/music
          git diff --cached --quiet && exit 0
          git commit -m "Control: $ACTION"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Make any Reel that is now missing
        if: contains('replace edit_slide', inputs.action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reel.yml --ref main -R "$GITHUB_REPOSITORY"
      - name: Check for a due post right away
        if: contains('post_now resume replace reschedule', inputs.action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main -R "$GITHUB_REPOSITORY"
