name: Preview

# Runs when new posts are queued: fetches stock photos (within the hourly budget),
# checks the posts and renders every slide. To look at them, open the run in the
# Actions tab and download the "slides" artifact.
on:
  push:
    paths: ["queue/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch stock photos, validate and render the newest day
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          day=$(ls -d queue/2*/ 2>/dev/null | sort | tail -1)
          if [ -z "$day" ]; then echo "No dated posts yet."; mkdir -p preview; exit 0; fi
          python scripts/stock.py "$day"
          python scripts/validate.py "$day"
          python scripts/render.py "$day"
      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: preview/
      - name: Save fetched photos
        run: |
          git config user.name "publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add state queue
          git diff --cached --quiet && exit 0
          git commit -m "Save stock photos"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
