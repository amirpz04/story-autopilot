name: Publish

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes; publishes at most one due post per run
  workflow_dispatch:

permissions:
  contents: write

# Shared with the Preview workflow so the two never write to the repo (or spend
# the Unsplash budget) at the same time.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stock photos (max 30 Unsplash requests per hour)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          day=$(python -c "import json,datetime,zoneinfo; print(datetime.datetime.now(zoneinfo.ZoneInfo(json.load(open('config.json'))['timezone'])).strftime('%Y-%m-%d'))")
          if [ -d "queue/$day" ]; then python scripts/stock.py "queue/$day"; fi

      - name: Is a post due?
        id: due
        run: echo "post=$(python scripts/publish.py --check)" >> "$GITHUB_OUTPUT"

      - name: Install renderer
        if: steps.due.outputs.post != ''
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Publish
        if: steps.due.outputs.post != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish.py

      - name: Update dashboard
        if: always()
        continue-on-error: true
        run: python scripts/dashboard.py

      - name: Save state
        if: always()
        run: |
          git config user.name "publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add state queue docs
          git diff --cached --quiet && exit 0
          git commit -m "Update publishing state ${{ steps.due.outputs.post }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
