name: Reel
run-name: "Reel: ${{ inputs.post_id }}"

# Started by the dashboard's "Make Reel" button. Renders the animated video for one post and stores it on the
# `reels` branch (newest 12 kept). Posts nothing to Instagram.
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post id"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video tools
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Make the Reel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_ID: ${{ inputs.post_id }}
        run: python scripts/reel_job.py "$POST_ID"
      - name: Save the record
        run: |
          git config user.name "publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add state/reels.json state/music_log.json
          git diff --cached --quiet && exit 0
          git commit -m "Reel made for ${{ inputs.post_id }}"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 6; done
