<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; src: url('/*FONT*/'); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0E0E10; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
  .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; will-change: transform, opacity; }
  .photo { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform; }
  .photo.blur { filter: blur(30px) brightness(.42) saturate(1.1); }
  /* dark band behind the big words so they read on any picture */
  .shade { position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.32) 0%, rgba(0,0,0,.2) 20%, rgba(0,0,0,.5) 40%, rgba(0,0,0,.62) 58%, rgba(0,0,0,.78) 78%, rgba(0,0,0,.9) 100%); }
  .bg { position: absolute; inset: 0; background: #0E0E10; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
  .ring { position: absolute; border-radius: 50%; border: 18px solid rgba(255,255,255,.06); will-change: transform; }

  /* Safe box: x 140-810 (clear of the right-hand buttons and the cropped screen edges), y 460-1220 (clear of the clock, the Reels header and the caption area) */
  .chunk { position: absolute; left: 140px; width: 670px; text-align: center; display: none; font-weight: 900; text-transform: uppercase;
           letter-spacing: -.01em; line-height: 1.02; will-change: transform; }
  .ln { display: table; margin: 0 auto; white-space: nowrap; }
  .w { display: inline-block; margin: 0 .17em; color: #fff; -webkit-text-stroke: .08em #000; paint-order: stroke fill;
       text-shadow: 0 .05em .14em rgba(0,0,0,.55); will-change: transform; }
  .kick { position: absolute; left: 140px; width: 670px; text-align: center; will-change: transform; }
  .kick span { display: inline-block; background: #FFD400; color: #000; font-weight: 900; font-size: 40px; letter-spacing: 4px; padding: 10px 26px; text-transform: uppercase; }
  .hero { position: absolute; left: 70px; width: 940px; text-align: center; font-weight: 900; text-transform: uppercase; color: #FFD400; white-space: nowrap;
          line-height: 1; letter-spacing: -.03em; -webkit-text-stroke: .06em #000; paint-order: stroke fill; text-shadow: 0 .06em .16em rgba(0,0,0,.6); will-change: transform; opacity: 0; }

  /* a slide with marks shows its whole photo as a framed picture above the words, over a blurred copy of itself */
  .card { position: absolute; will-change: transform; box-shadow: 0 18px 60px rgba(0,0,0,.6); border-radius: 6px; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; }
  .card .mk { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 50; pointer-events: none; }
</style>
<script>/*MARKSJS*/</script>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<script>
const S = /*SCENES*/[]/*END*/;
const TR = 0.26;                                  // quick overlap of one scene into the next, seconds
const YELLOW = "#FFD400";
const clamp = x => Math.max(0, Math.min(1, x));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const isHot = w => /[\d$%]/.test(w);               // numbers slam in
const STOP = new Set("a an the of to in on at for and or but is are was were it its as by with so no not this that".split(" "));

// Group a scene's words into short punchy chunks of 1-3 words (never ending on "the", "of"...), cut at punctuation.
function chunkify(words) {
  const out = []; let cur = [];
  words.forEach((w, i) => {
    cur.push(w);
    const letters = cur.reduce((a, x) => a + x.w.length, 0), last = i === words.length - 1;
    const endsPhrase = /[.!?,;:—–]$/.test(w.w), stop = STOP.has(w.w.toLowerCase().replace(/[^a-z]/g, ""));
    if (last || endsPhrase || cur.length >= 3 || (letters >= 11 && !stop) || letters >= 17) { out.push(cur); cur = []; }
  });
  return out;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

const stage = document.getElementById("stage");
S.forEach((s, i) => {
  const el = document.createElement("div"); el.className = "scene"; s.el = el;
  let html = "";
  if (s.photo) html += `<img class="photo" src="${s.photo}" alt=""><div class="shade"></div>`;
  else html += `<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="ring r1"></div><div class="ring r2"></div></div>`;
  el.innerHTML = html; stage.appendChild(el);
  s.photoEl = el.querySelector(".photo"); s.shadeEl = el.querySelector(".shade");
  if (s.photoEl) {                               // size the photo to cover the 1080x1920 frame
    const ar = s.ar; let w, h;
    if (ar >= 1080 / 1920) { h = 1920; w = h * ar; } else { w = 1080; h = w / ar; }
    s.photoEl.style.width = w + "px"; s.photoEl.style.height = h + "px"; s.pw = w; s.ph = h;
    if (s.marks && s.marks.length) {             // framed picture + marks layer (placed in fitAll)
      s.photoEl.classList.add("blur");
      s.cardEl = document.createElement("div"); s.cardEl.className = "card";
      s.cardEl.innerHTML = `<img src="${s.photo}" alt=""><div class="mk"></div>`;
      s.shadeEl.after(s.cardEl); s.mkEl = s.cardEl.querySelector(".mk");
    }
  } else {
    s.blobs = [...el.querySelectorAll(".blob")]; s.rings = [...el.querySelectorAll(".ring")];
    const cols = ["rgba(255,212,0,.20)", "rgba(91,108,146,.55)", "rgba(255,110,70,.16)"], sizes = [760, 900, 640];
    s.blobs.forEach((b, k) => { b.style.width = b.style.height = sizes[k] + "px"; b.style.background = cols[(k + i) % 3]; b.style.left = (k * 300 - 120) + "px"; b.style.top = (k * 520 + 40) + "px"; });
    s.rings.forEach((r, k) => { const d = k ? 520 : 900; r.style.width = r.style.height = d + "px"; r.style.left = (k ? 600 : -220) + "px"; r.style.top = (k ? 1180 : 180) + "px"; });
  }

  // the big words: chunks of 1-3 words, each an element shown only while it is being said
  s.chunks = chunkify(s.words || []).map((cw, ci) => {
    const el2 = document.createElement("div"); el2.className = "chunk";
    const total = cw.reduce((a, x) => a + x.w.length, 0);
    let split = cw.length;                       // stack 2+ words on two lines (bigger letters), split where the lines are most even
    if (cw.length >= 2 && total > 6) {
      let best = 1e9; split = 1;
      for (let k = 1; k < cw.length; k++) {
        const a = cw.slice(0, k).reduce((q, x) => q + x.w.length, 0), d = Math.abs(a - (total - a));
        if (d < best) { best = d; split = k; }
      }
    }
    const spans = cw.map(x => { const sp = document.createElement("span"); sp.className = "w"; sp.textContent = x.w; x.el = sp; x.hot = isHot(x.w); x.tag = x.w[0] === "@"; return sp; });
    const lines = split >= cw.length ? [spans] : [spans.slice(0, split), spans.slice(split)];
    lines.forEach(ls => { const ln = document.createElement("div"); ln.className = "ln"; ls.forEach(sp => ln.appendChild(sp)); el2.appendChild(ln); });
    el.appendChild(el2);
    return {words: cw, el: el2, start: Math.max(0.1, cw[0].t - 0.05), tilt: ((ci * 37 + i * 11) % 5 - 2) * 0.9, y: 900};
  });
  s.chunks.forEach((c, k) => { if (k) c.start = Math.max(c.start, s.chunks[k - 1].start + 0.12); });

  // extra moments: a number on its own, huge, on plain slides; a tag on the cover
  if (!s.photo && s.type === "text") {
    const m = (s.text || "").match(/\$?\d(?:[\d,]*\d)?(?:\.\d+)?(?:\s?(?:%|percent|million|billion|trillion|years?|miles?|feet|days|hours|degrees|times))?/i);
    if (m) {
      const idx = s.words.findIndex(w => w.w.includes(m[0].split(/\s/)[0]));
      s.hero = document.createElement("div"); s.hero.className = "hero"; s.hero.innerHTML = "<span style=\"display:inline-block\">" + esc(m[0].trim()) + "</span>";
      s.heroT = idx >= 0 ? s.words[idx].t : 0.4; el.appendChild(s.hero);
    }
  }
  if (s.kicker) {
    s.kickEl = document.createElement("div"); s.kickEl.className = "kick"; s.kickEl.innerHTML = `<span>${esc(s.kicker)}</span>`; el.appendChild(s.kickEl);
  }
  // camera / flash beats: every new chunk and every number gives the picture a small punch
  s.beats = s.chunks.map(c => ({t: c.start, a: 0.016}));
  s.chunks.forEach(c => c.words.forEach(w => { if (w.hot) s.beats.push({t: w.t, a: 0.045}); }));
});

function render(t) {
  let flash = 0;
  S.forEach((s, i) => {
    const lt = t - s.start, end = s.start + s.dur;
    const visible = lt > -0.001 && t < end + TR;
    s.el.style.display = visible ? "block" : "none";
    if (!visible) return;

    // quick whip cut: the new scene zooms in from slightly large with a brief white flash, the old one fades out
    let op = 1, sc = 1;
    if (i > 0 && lt < TR) { const p = outCubic(clamp(lt / TR)); op = clamp(lt / 0.09); sc = 1.17 - 0.17 * p; flash = Math.max(flash, 0.5 * (1 - clamp(lt / 0.12))); }
    if (t > end) { const p = clamp((t - end) / TR); op = Math.min(op, 1 - p); sc *= 1 + 0.05 * p; }
    s.el.style.opacity = op; s.el.style.transform = `scale(${sc})`;

    // punch (decays in ~0.3 s) on every beat
    let punch = 0;
    s.beats.forEach(b => { const a = lt - b.t; if (a >= 0 && a < 0.3) punch += b.a * Math.pow(1 - a / 0.3, 2); });

    // picture camera
    const e = inOutCubic(clamp(lt / (s.dur + TR)));
    if (s.cardEl) {                                // framed picture: slow push in, marks draw themselves
      s.cardEl.style.transform = `scale(${1 + 0.04 * e + punch * 0.5})`;
      s.photoEl.style.transform = `translate(${-(s.pw - 1080) / 2}px, ${-(s.ph - 1920) / 2}px) scale(${1.1 + 0.07 * e})`;
      if (s.show) s.show(lt - 0.7);
    } else if (s.photoEl) {                        // drifting camera with a punch on each beat
      const zoom = (1.0 + 0.12 * e) * (1 + punch);
      const slackX = s.pw - 1080, slackY = s.ph - 1920;
      let tx, ty;
      if (slackX > 60) { const a = s.dir > 0 ? 0.14 : 0.86, z = s.dir > 0 ? 0.86 : 0.14; tx = -slackX * (a + (z - a) * e); } else tx = -slackX / 2;
      if (slackY > 60) ty = -slackY * (0.5 + 0.18 * (s.dir > 0 ? e : -e)); else ty = -slackY / 2;
      s.photoEl.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
    } else {                                       // plain slide: drifting colour blobs and rings
      const f = [[.5, .4, 0], [.35, .55, 2], [.6, .3, 4]];
      s.blobs.forEach((b, k) => { b.style.transform = `translate(${Math.sin(lt * f[k][0] + f[k][2]) * 140}px, ${Math.cos(lt * f[k][1] + f[k][2]) * 160}px)`; });
      s.rings.forEach((r, k) => { r.style.transform = `translate(${Math.sin(lt * .4 + k) * 40}px, ${Math.cos(lt * .3 + k) * 40}px) rotate(${lt * (k ? -9 : 7)}deg) scale(${1 + 0.05 * Math.sin(lt * 1.3 + k) + punch * 2})`; });
    }

    // cover tag
    if (s.kickEl) { const p = clamp((lt - 0.1) / 0.3); s.kickEl.style.opacity = p; s.kickEl.style.transform = `scale(${0.7 + 0.3 * outBack(p)})`; }

    // hero number: slams in the moment it is spoken
    if (s.hero) {
      const a = lt - s.heroT;
      if (a < 0) s.hero.style.opacity = 0;
      else { const p = clamp(a / 0.24), fade = t > end ? 1 - clamp((t - end) / 0.12) : 1;
        s.hero.style.opacity = fade; s.hero.style.transform = `translate(${Math.sin(a * 80) * 14 * Math.pow(1 - p, 2)}px, 0) scale(${1 + 0.9 * Math.pow(1 - outCubic(p), 1.5)})`; }
    }

    // the big words
    let ci = -1;
    s.chunks.forEach((c, k) => { if (lt >= c.start) ci = k; });
    s.chunks.forEach((c, k) => {
      if (k !== ci) { c.el.style.display = "none"; return; }
      const age = lt - c.start, p = clamp(age / 0.15);
      const fadeOut = t > end ? 1 - clamp((t - end) / 0.1) : 1;
      c.el.style.display = "block"; c.el.style.opacity = fadeOut;
      c.el.style.transform = `translateY(-50%) translateY(${(1 - p) * 34}px) scale(${0.6 + 0.4 * outBack(p)}) rotate(${c.tilt * (0.4 + 0.6 * p)}deg)`;
      c.words.forEach(w => {
        const a = lt - w.t, spoken = a >= 0, cur = spoken && lt < w.e + 0.04;
        let o = 1, tr = "", col = "#fff";
        if (w.hot) {                              // numbers stay hidden until said, then slam in
          if (!spoken) o = 0;
          else { const q = clamp(a / 0.22); tr = `translate(${Math.sin(a * 85) * 12 * Math.pow(1 - q, 2)}px, 0) scale(${1 + 0.8 * Math.pow(1 - outCubic(q), 1.5)})`; col = YELLOW; }
        } else if (cur) { tr = `scale(${1 + 0.15 * (1 - clamp(a / 0.2))})`; col = YELLOW; }
        if (w.tag) col = YELLOW;
        w.el.style.opacity = o; w.el.style.transform = tr; w.el.style.color = col;
      });
    });
  });
  document.getElementById("flash").style.opacity = flash;
}

// Called once after fonts and pictures have loaded: size every group of big words to fit the safe box, place the framed
// pictures and the huge numbers. Every scene is shown while it is measured (hidden ones measure as 0).
window.fitAll = () => {
  S.forEach(s => {
    const was = s.el.style.display; s.el.style.display = "block";
    let zoneTop = 500, zoneBottom = 1200, capY = 880, maxFont = 150;
    if (s.cardEl) {                                 // whole picture on top, words below it
      const top = 250, bottom = 790, maxW = 900, maxH = bottom - top;
      let w = maxW, h = w / s.ar; if (h > maxH) { h = maxH; w = h * s.ar; }
      const left = Math.max(60, Math.min(1080 - 60 - w, 475 - w / 2));
      Object.assign(s.cardEl.style, {left: left + "px", top: (top + (maxH - h) / 2) + "px", width: w + "px", height: h + "px"});
      const f = marksFocus(s.marks, s.focus);
      s.cardEl.style.transformOrigin = (f[0] * 100) + "% " + (f[1] * 100) + "%";
      s.show = drawMarks(s.mkEl, s.marks, w, h, s.photo, {fontSize: 34, stroke: 8});
      zoneTop = 850; zoneBottom = 1210; capY = 1030; maxFont = 118;
    } else if (s.hero) {                            // huge number above, words below
      let size = 260; s.hero.style.fontSize = size + "px"; s.hero.style.top = "480px";
      while (s.hero.firstChild.offsetWidth > 880 && size > 90) { size -= 8; s.hero.style.fontSize = size + "px"; }
      zoneTop = 800; zoneBottom = 1210; capY = 1010; maxFont = 130;
    } else if (s.kickEl) { s.kickEl.style.top = "560px"; capY = 930; }
    if (s.kickEl && s.cardEl) s.kickEl.style.top = "560px";
    s.chunks.forEach(c => {
      c.y = capY; c.el.style.top = capY + "px"; c.el.style.display = "block";
      let size = maxFont; c.el.style.fontSize = size + "px";
      const widest = () => Math.max(...[...c.el.querySelectorAll(".ln")].map(l => l.offsetWidth));
      while ((widest() > 664 || c.el.offsetHeight > zoneBottom - zoneTop) && size > 80) { size -= 4; c.el.style.fontSize = size + "px"; }
      c.el.style.display = "none";
    });
    s.el.style.display = was;
  });
  render(0);
};
window.render = render;
window.TOTAL = S.length ? S[S.length - 1].start + S[S.length - 1].dur : 0;
render(0);
</script>
</body>
</html>
